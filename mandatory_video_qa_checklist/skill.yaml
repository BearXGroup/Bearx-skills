  rationale: 'The Paraguay video v1 passed the audio identity gate at 0.954 yet shipped hissing like a radio and slide heavy with too few real photos, and the user flagged both on 2026-11-05. The gate in video_sound_preflight checks identity at 0.90, contamination below 0.05, and audible sound at start, middle, and end, but it measures no hiss in pauses and no visual density. The corrected v2 measured pauses at minus 75 dB against minus 37 dB defective, gate 0.998, 38 of 47 scenes real photo, and element change at most 7.9 seconds. The user then ordered a mandatory five block checklist, which exists only as a workspace file at ~/workspace/video-stack/CHECKLIST-VIDEO-OBRIGATORIO.md and is not discoverable as a skill. This new skill codifies that checklist as a reusable pre-upload gate, complements video_sound_preflight instead of replacing it, and folds in the already ordered 0.5 second voice gap, 8 percent music cap with rotation, element density, real photos plus real data, and hook plus pinned bait. Other findings in this window were left alone: comment duplication and retry handling are already covered by publish_once_guard, which is still inside its measurement window, and the LaFora Instagram promise and the expired approval retry are covered by browser_account_identity_check and publish_once_guard respectively.'
