  rationale: On 2026-11-12 the FORTE test video v4 shipped with the voice reading Selic as written, which the user flagged as the wrong popular pronunciation, and the same session kept writing Nigro as negro in five messages after the user spelled N I G R O aloud. A skill search for TTS pronunciation found no covering skill, and the spoken audio skill only covers writing numbers, times, and abbreviations as they should sound. Narration runs daily across the video fronts, so the miss will recur with finance terms. This skill adds the specific respell and listen method, plus the spelled name rule, without touching any managed skill inside its measurement window.
