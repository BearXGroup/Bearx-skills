  rationale: 'Repeated evidence shows browser work acting on the wrong logged in account: a bulletin was posted on the wrong TikTok account and had to be deleted and confirmed in TikTok Studio (03619bdb, 65cc1c99), a later TikTok session was logged in as a different account so no verification appeared and switching was judged not worth dropping the working session (8badc33b), deletion was refused on the wrong account because the vault held only the other account login (1bb7f114), Instagram follower reads and keyword auto messages failed under a security action on the intended account (4265beb8, 142a0edb), and a recheck found the challenged account still stuck on its start screen (8998cdfa). Cron workers also paused repeatedly because instagram.com needed an action only the user can take (d68dcd43-5124-4279-9b8f-dc01ad152425, 265ae5e2-c12a-4fc2-92ce-1fbc8b07d983, 0ff5bf15-d5ad-4a97-8105-921061fb4ad1, 475c0eb0-f048-4d69-8c4f-78440b89aa31). The system social publishing skill says to identify the account and read a post back, but it does not require reading the handle from the profile interface before acting, distinguishing a wrong session from a security challenge, or stating the tradeoff before dropping a working session. This new skill makes that check discoverable to delegated browser work. Restraint applied: the two managed publishing skills were not re-proposed inside their measurement windows, the FORTE hook file is unmanaged and out of scope for an update, and the single unresolved static carousel music case was not turned into a new skill.'
