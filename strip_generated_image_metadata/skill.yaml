  rationale: 'On 2026-11-11 the Lily Instagram post https://www.instagram.com/p/Dfm9Poushbx/ received an auto-applied AI label even though the assistant activated no label, because the generated photo carried embedded C2PA metadata (assistant-msg-4aea524d). That breaks the standing Lily rule of no AI mention. AGENTS.md records the fix as re-encoding with PIL save JPEG q92 to produce a file without EXIF or C2PA, but no skill codifies it and a skill search for metadata stripping and C2PA removal returned no covering skill. The Lily routine posts generated photos daily, so the failure will recur without a reusable pre-publish step. The other findings in this window were deliberately not proposed: the FORTE text-cut failure, the wrong-account post and the duplicate post are already covered by managed skills inside their measurement windows (mandatory_video_qa_checklist review_after 2026-11-26, browser_account_identity_check review_after 2026-11-22, publish_once_guard review_after 2026-11-20).'
