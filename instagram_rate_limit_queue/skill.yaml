  rationale: On 2026-11-07 Instagram returned 429 in three separate Frases slots while Facebook had already posted, the affected cron jobs failed, and the pending Instagram reposts were handled ad hoc in chat. The managed publish_once_guard covers duplicate posts and uncertain retries but has no 429 recognition rule, no per-destination pending queue, and no rule against republishing a destination that already succeeded. This new skill adds that distinct queue method without touching any managed skill inside its measurement window.
